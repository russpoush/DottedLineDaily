<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotted Line Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --ink:#1d1d1f; --muted:#6b6760; --line:#e2ddd2; --paper:#fffdf8;
  --accent:#c2410c; --accent-soft:#fde7d9; --good:#15803d; --good-soft:#dcfce7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --flag:#fef3c7; --flag-edge:#d97706; --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--ink)}
.logo .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.pill.pro{background:var(--ink);color:#fff;border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 6px}
h2{font-size:17px;margin:24px 0 10px}
.muted{color:var(--muted)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:grid;gap:8px}
.case{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;color:var(--ink)}
.case small{color:var(--muted)}
.case .tag{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--muted);white-space:nowrap}
.case .tag.done{background:var(--good-soft);color:var(--good)}
.case .tag.lock{background:#eee;color:#555}
/* document */
.docbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 #e9e3d6,0 8px 24px rgba(0,0,0,.05);padding:28px 26px;font-family:"Source Serif 4",Georgia,serif;font-size:15.5px}
.paper h3{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 2px}
.paper .sub{font-size:13px;color:var(--muted);margin-bottom:16px;font-family:Inter,sans-serif}
.clause{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px 72px 8px 34px;margin:2px 0;position:relative;color:var(--ink);font:inherit;line-height:1.55}
.clause:hover{background:#f7f2e6}
.clause .n{position:absolute;left:8px;top:9px;font:600 11px Inter,sans-serif;color:#a39d90}
.clause.flagged{background:var(--flag);border-color:var(--flag-edge)}
.clause.flagged .n{color:var(--flag-edge)}
.clause.flagged::after{content:"⚑";position:absolute;right:10px;top:7px;color:var(--flag-edge)}
.clause.hit{background:var(--good-soft);border-color:var(--good)}
.clause.miss{background:var(--bad-soft);border-color:var(--bad);border-style:dashed}
.clause.false{background:#f3f4f6;border-color:#9ca3af;text-decoration:line-through;text-decoration-color:#9ca3af}
.clause.hit::after{content:"✓ caught";color:var(--good);font:600 11px Inter;position:absolute;right:10px;top:9px}
.clause.miss::after{content:"missed";color:var(--bad);font:600 11px Inter;position:absolute;right:10px;top:9px}
.clause.false::after{content:"fine";color:#6b7280;font:600 11px Inter;position:absolute;right:10px;top:9px}
.clause[disabled]{cursor:default}
.clause.table{font-family:ui-monospace,Menlo,monospace;font-size:13px}
/* results */
.score{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em}
.squares{font-size:20px;letter-spacing:2px}
.trap{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:12px;padding:16px;margin:10px 0}
.trap.missed{border-left-color:var(--bad)}
.trap h4{margin:0 0 4px;font-size:16px}
.trap .cost{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;border-radius:6px;padding:3px 8px;margin:6px 0}
.script{background:#f8f7f4;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;font-family:"Source Serif 4",Georgia,serif;font-style:italic;position:relative}
.script b{font-family:Inter;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.copy{position:absolute;top:8px;right:8px;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px}
.decoy{background:var(--card);border:1px solid var(--line);border-left:4px solid #9ca3af;border-radius:12px;padding:12px 16px;margin:8px 0;font-size:14px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.scrim.on{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:24px}
.modal ul{padding-left:18px;margin:10px 0 16px}
.modal li{margin:4px 0}
.price{font-size:28px;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.foot{font-size:12px;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:520px){.paper{padding:20px 12px}.clause{padding-left:30px;padding-right:64px}.big{font-size:26px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

{

      trap:{amt:1464, name:"Mandatory monthly fees not in the advertised rent", why:"If you can't decline it, it's rent with a different name. These four fees make the real rent $1,417, not $1,295. Several states and cities now require these to be included in the advertised rent.", cost:"$122/month: $1,464 a year, $1,586 over the 13-month lease.",

      trap:{amt:1295, name:"\"Free month\" clawback", why:"The free month is a loan that's forgiven only if you finish the lease. Early termination includes a job transfer or any other reason you have to leave, and this comes on top of any break fee.", cost:"$1,295 owed back if you leave early.",

    {t:"6. Garage parking (optional): $75/month.", ok:"Optional. You can decline it."},

{
  id:"payday", track:"Money", title:"Payday loan agreement",

  lines:[

    {t:"Finance charge: $60.00 ($15 per $100), due in full in 14 days.", cls:"table",
      trap:{amt:60, name:"A 390% annual rate hiding as a flat fee", why:"$15 per $100 sounds small. Over two weeks, it works out to about a 390% APR. Look for the APR box on the agreement: lenders must show it.", cost:"$60 for two weeks; about $1,560 if you kept $400 borrowed for a year.",
      script:"What's the APR on this loan? I'd like to see it before I sign. (Then compare: credit unions offer small 'payday alternative loans' capped at 28% APR.)"}},
    {t:"Extension option: you may extend the due date by 14 days by paying the finance charge on or before the due date.",
      trap:{amt:300, name:"Rollover trap", why:"Each renewal costs another $60 and pays down nothing. Many borrowers renew again and again; this is how a $400 loan becomes a $1,000 problem.", cost:"Five renewals: $300 in fees and you still owe $400.",
      script:"If I can't repay in full, do you offer an extended payment plan with no added fees? Many states require lenders to offer one."}},
    {t:"Borrower authorizes Lender to debit the account on the due date and to re-attempt the debit if it is returned.",
      trap:{amt:70, name:"Repeated withdrawal attempts", why:"Each failed attempt can trigger a bank fee to you, on top of the lender's returned-payment fee. Several attempts in a week can stack up fast.", cost:"Two failed attempts at a $35 bank fee each: $70, plus the lender's $25 return fee.",
      script:"I'd rather pay by cash or debit card on the due date than authorize automatic withdrawals. Can I strike that authorization?"}},
    {t:"Lender license number: DL-20481, issued by the state Department of Financial Institutions.", ok:"Good sign: you can look up the license. Unlicensed online lenders are a bigger risk."},
    {t:"Returned-item fee: $25 (state maximum).", ok:"Capped by state law and disclosed. Fair."},
    {t:"Borrower may cancel this agreement without cost by returning the $400 by 5:00 p.m. the next business day.", ok:"A free cancellation window. Useful if you find cheaper money."},
    {t:"Questions or complaints: State Department of Financial Institutions, (555) 014-3300.", ok:"A regulator's contact, required in many states. Good sign."}

{
  id:"severance", track:"Work", title:"Severance agreement",
  org:"Separation Agreement and General Release", setting:"You're 52 and your job was eliminated. HR hands you this and asks for a signature by Friday, in five days.",
  lines:[
    {t:"1. Severance: $8,000 (four weeks' pay), paid in a lump sum after the Effective Date.", ok:"The core offer. Often negotiable, but nothing hidden."},
    {t:"2. You release the Company from all claims arising up to the date you sign, including claims under the Age Discrimination in Employment Act.", ok:"A release is the point of a severance agreement. You're trading claims for money; that's why the review time in line 3 matters."},
    {t:"3. You must sign and return this Agreement within five (5) days. This Agreement is effective immediately upon signature.",
      trap:{amt:0, name:"Too little time for someone 40+", why:"To release age-discrimination claims from a worker 40 or older, federal law (the Older Workers Benefit Protection Act) requires at least 21 days to consider (45 in a group layoff) and 7 days to revoke after signing. A 5-day deadline doesn't meet that.", cost:"Your ability to review the deal, get advice or negotiate.",
      script:"Since I'm over 40 and this releases age claims, I understand I'm entitled to 21 days to consider it and 7 days to revoke after signing. Please send a corrected version, and I'll respond within that period."}},
    {t:"4. You agree not to make statements that disparage the Company, its officers, directors or products.",
      trap:{amt:0, name:"One-sided non-disparagement", why:"You can't criticize them, but nothing stops them from criticizing you, including to future employers. Ask for it to go both ways, or at least for a neutral reference.", cost:"Your reputation in reference checks.",
      script:"Can we make this mutual, and add that the company will confirm only my dates of employment and title to reference checks?"}},
    {t:"5. Upon breach of this Agreement, amounts paid under Section 1 are subject to return, together with the Company's reasonable attorneys' fees.",
      trap:{amt:8000, name:"Full clawback over any breach", why:"'Breach' isn't limited to a serious one, so a minor slip could count. Combined with the broad non-disparagement clause, a single critical post could cost the entire $8,000 plus their legal bills. (A clawback like this can't be used to punish you for challenging the age-discrimination waiver itself.)", cost:"$8,000 plus legal fees.",
      script:"Please limit repayment to a material breach found by a court, and remove the attorneys' fees provision or make it apply to whichever side loses."}},
    {t:"6. Nothing in this Agreement prevents you from filing a charge with the EEOC or other government agency.", ok:"Standard carve-out: the right to file an EEOC charge can't be signed away anyway. Good to see it stated."},
    {t:"7. Your health coverage ends on the last day of the month; you may elect COBRA continuation.", ok:"Standard. Ask whether they'll pay COBRA premiums for a few months; that's a common negotiation."},
    {t:"8. Accrued, unused paid time off will be paid in your final paycheck.", ok:"Good, and required in some states."}
  ]
},

const todayIdx = () => dayIndex() % CASES.length;
const cycle = () => Math.floor(dayIndex() / CASES.length);
const hardMode = i => i===todayIdx() && cycle()>0;
const rkey = i => hardMode(i) ? CASES[i].id+'@'+cycle() : CASES[i].id;
const trapCount = c => c.lines.filter(l=>l.trap).length;

function totals(){
  let caught=0, total=0, played=0, saved=0;
  for(const id in S.results){const r=S.results[id];played++;caught+=r.caught;total+=r.total;saved+=r.saved||0}
  return {caught,total,played,saved};
}
function streak(){
  const d=store.get("days",[]); let s=0; let t=new Date(); t.setHours(0,0,0,0);
  const has = x => d.includes(x.toISOString().slice(0,10));
  if(!has(t)) t.setDate(t.getDate()-1);
  while(has(t)){s++; t.setDate(t.getDate()-1)}
  return s;
}
function markDay(){const d=store.get("days",[]);const k=new Date();k.setHours(0,0,0,0);const s=k.toISOString().slice(0,10);if(!d.includes(s)){d.push(s);store.set("days",d)}}

// ---------- render ----------
const $app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function header(){
  return `<header><button class="logo" data-go="home"><span class="mark">⚑</span>${APP_NAME}</button>
  <button class="pill ${S.pro?"pro":""}" data-act="pro">${S.pro?"Pro preview on":"Go Pro · $3/mo"}</button></header>`;
}

function home(){
  const t=todayIdx(), c=CASES[t], r=S.results[rkey(t)], tot=totals();
  const tracks=["All",...new Set(CASES.map(x=>x.track))];
  const archive = CASES.map((x,i)=>{
    if(i===t) return "";
    if(S.track && S.track!=="All" && x.track!==S.track) return "";
    const done=S.results[x.id], locked=!S.pro;
    return `<button class="case" data-open="${i}" ${locked?'data-locked="1"':""}>
      <div><b>${x.title}</b><br><small>${x.track}</small></div>
      <span class="tag ${done?"done":locked?"lock":""}">${done?`${done.caught}/${done.total} caught`:locked?"🔒 Pro":"Play"}</span></button>`;
  }).join("");
  $app.innerHTML = header()+`
  <div class="stats">
    <div class="stat"><b>${streak()}🔥</b><span>day streak</span></div>
    <div class="stat"><b>${tot.caught}</b><span>traps caught</span></div>
    <div class="stat"><b>$${tot.saved.toLocaleString()}</b><span>you'd have kept</span></div>
  </div>
  <div class="hero">
    <div class="eyebrow">Today's case · ${c.track}</div>
    <h1>${c.title}</h1>
    <p class="muted">${c.setting}</p>
    ${hardMode(t)?`<p><b>Expert round:</b> you've seen this one before, but the trap count is hidden this time, just like a real contract. Flag what you'd push back on.</p>`:`<p>Somewhere in this document are <b>${trapCount(c)} traps</b>. Tap the clauses you'd push back on, then check your answers. Each trap comes with what it would cost you and exactly what to say.</p>`}
    <div class="row"><button class="btn accent" data-open="${t}">${r?"Review today's case":"Read the fine print →"}</button>
    ${r?`<span class="muted">You caught ${r.caught}/${r.total}. New case tomorrow.</span>`:""}</div>
  </div>
  <h2>Practice by track <span class="muted" style="font-weight:400;font-size:13px">· ${CASES.length} cases</span></h2>
  <div class="row" style="margin-bottom:10px">${tracks.map(k=>`<button class="pill ${ (S.track||"All")===k?"pro":""}" data-track="${k}">${k}</button>`).join("")}</div>
  <div class="list">${archive}</div>
  ${FEEDBACK_URL?`<div class="hero" style="margin-top:18px"><b>Testing ${APP_NAME}?</b><p class="muted" style="margin:4px 0 10px">Your answers decide whether this becomes a real app. It takes a minute.</p><a class="btn accent" style="text-decoration:none;display:inline-block" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Give feedback</a></div>`:""}
  <div class="foot">${APP_NAME} is a prototype. The documents are fictional, and the explanations are general education, not legal or financial advice. Rules vary by state.</div>`;
}

function play(){
  const c=CASES[S.caseIdx], n=c.lines.filter(l=>l.trap).length;
  const lines = c.lines.map((l,i)=>{
    let cls="clause "+(l.cls||"");
    if(S.submitted){
      const f=S.flags.has(i);
      if(l.trap) cls+= f?" hit":" miss";
      else if(f) cls+=" false";
    } else if(S.flags.has(i)) cls+=" flagged";
    return `<button class="${cls}" data-line="${i}" ${S.submitted?"disabled":""}><span class="n">${i+1}</span>${esc(l.t.replace(/^\d+\.\s*/,""))}</button>`;
  }).join("");
  $app.innerHTML = header()+`
  <div class="docbar">
    <div><div class="eyebrow">${c.track} · Case #${caseNo(S.caseIdx)}</div><b>${c.title}</b></div>
    ${S.submitted?`<button class="btn alt" data-go="home">Done</button>`:
      `<div class="row"><span class="muted" style="font-size:13px">${S.flags.size} flagged · ${hardMode(S.caseIdx)?"count hidden":n+" hidden"}</span><button class="btn" data-act="submit" ${S.flags.size?"":"disabled"}>Check answers</button></div>`}
  </div>
  <p class="muted" style="margin:0 0 12px">${c.setting}</p>
  ${S.submitted?results():""}
  <div class="paper"><h3>${esc(c.org)}</h3><div class="sub">Tap any clause to flag it</div>${lines}</div>`;
}

function results(){
  const c=CASES[S.caseIdx];
  const traps=c.lines.map((l,i)=>({...l,i})).filter(l=>l.trap);
  const decoys=c.lines.map((l,i)=>({...l,i})).filter(l=>!l.trap && S.flags.has(l.i));
  const caught=traps.filter(t=>S.flags.has(t.i)).length;
  const sq=traps.map(t=>S.flags.has(t.i)?"🟩":"🟥").join("")+"⬜".repeat(decoys.length);
  const msg = caught===traps.length && !decoys.length ? "Sharp eyes. Nothing got past you."
    : caught===traps.length ? "You caught every trap. Watch the false alarms: flagging fair clauses costs you credibility when you negotiate."
    : `You'd have signed with ${traps.length-caught} trap${traps.length-caught>1?"s":""} still in it.`;
  return `<div class="score">
    <div class="row" style="justify-content:space-between">
      <div><div class="big">${caught}/${traps.length} traps caught</div>
      <div class="muted">${decoys.length} false alarm${decoys.length===1?"":"s"}</div></div>
      <div class="squares">${sq}</div>
    </div>
    <p>${msg}</p>
    <div class="row"><button class="btn alt" data-act="share">Copy result</button>${FEEDBACK_URL?`<a class="btn accent" style="text-decoration:none" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Tell us what you think (1 min)</a>`:""}</div>
  </div>
  <h2>The traps</h2>
  ${traps.map(t=>`<div class="trap ${S.flags.has(t.i)?"":"missed"}">
    <h4>${S.flags.has(t.i)?"✓":"✗"} Line ${t.i+1}: ${t.trap.name}</h4>
    <div>${t.trap.why}</div>
    <div class="cost">What it costs: ${t.trap.cost}</div>
    <div class="script"><b>What to say</b>“${t.trap.script}”<button class="copy" data-copy="${esc(t.trap.script)}">Copy</button></div>
  </div>`).join("")}
  ${decoys.length?`<h2>Why these were fine</h2>`+decoys.map(d=>`<div class="decoy"><b>Line ${d.i+1}:</b> ${d.ok}</div>`).join(""):""}
  ${!S.pro?`<div class="hero" style="margin-top:18px"><b>Want more practice?</b><p class="muted" style="margin:4px 0 10px">Pro unlocks every past case, skill tracks for housing, money, health and work, and a library of every negotiation script.</p><button class="btn" data-act="pro">See Pro</button></div>`:""}
  <h2>The document</h2>`;
}

function render(){ S.view==="play"?play():home(); }

// ---------- actions ----------
function openCase(i){
  const c=CASES[i]; const r=S.results[rkey(i)];
  S.caseIdx=i; S.view="play";
  if(r){S.flags=new Set(r.flags);S.submitted=true}else{S.flags=new Set();S.submitted=false}
  render(); window.scrollTo(0,0);
}
function submit(){
  const c=CASES[S.caseIdx];
  const traps=c.lines.map((l,i)=>({l,i})).filter(x=>x.l.trap);
  const hit=traps.filter(x=>S.flags.has(x.i));
  const saved=hit.reduce((a,x)=>a+(x.l.trap.amt||0),0);
  S.results[rkey(S.caseIdx)]={flags:[...S.flags],caught:hit.length,total:traps.length,false:S.flags.size-hit.length,saved:Math.round(saved)};
  store.set("results",S.results); markDay();
  S.submitted=true; render(); window.scrollTo(0,0);
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copied")}catch(e){toast("Couldn't copy. Select the text instead.")}}
function proModal(){
  document.getElementById("modal").innerHTML=`
    <div class="eyebrow">${APP_NAME} Pro</div>
    <div class="price">$3<span style="font-size:15px;font-weight:500" class="muted">/month</span> <span style="font-size:14px" class="muted">or $24/year</span></div>
    <p class="muted">One caught trap usually pays for years of Pro.</p>
    <ul>
      <li><b>Full case library</b>: all ${CASES.length} documents, any time, with new cases every month</li>
      <li><b>Skill tracks</b>: housing, money, health, work, everyday</li>
      <li><b>Script library</b>: every "what to say" line, searchable</li>
      <li><b>Expert rounds</b>: replay cases with the trap count hidden</li>
    </ul>
    <div class="row"><button class="btn" data-act="togglepro">${S.pro?"Turn off Pro preview":"Preview Pro (prototype)"}</button><button class="btn alt" data-act="close">Not now</button></div>
    <div class="note">Prototype: no payment is taken. The preview unlocks the archive so you can try every case.</div>`;
  document.getElementById("scrim").classList.add("on");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.copy){copy(b.dataset.copy);return}
  if(b.dataset.track){S.track=b.dataset.track;render();return}
  if(b.dataset.go==="home"){S.view="home";render();window.scrollTo(0,0);return}
  if(b.dataset.open!==undefined){ if(b.dataset.locked){proModal();return} openCase(+b.dataset.open);return}
  if(b.dataset.line!==undefined && !S.submitted){const i=+b.dataset.line;S.flags.has(i)?S.flags.delete(i):S.flags.add(i);render();return}
  const a=b.dataset.act;
  if(a==="submit") submit();
  else if(a==="pro") proModal();
  else if(a==="close") document.getElementById("scrim").classList.remove("on");
  else if(a==="togglepro"){S.pro=!S.pro;store.set("pro",S.pro);document.getElementById("scrim").classList.remove("on");render()}
  else if(a==="share"){
    const c=CASES[S.caseIdx], r=S.results[rkey(S.caseIdx)];
    const traps=c.lines.map((l,i)=>({l,i})).filter(x=>x.l.trap);
    const sq=traps.map(x=>r.flags.includes(x.i)?"🟩":"🟥").join("")+"⬜".repeat(r.false);
    copy(`${APP_NAME} #${caseNo(S.caseIdx)} · ${c.title}\n${sq}\n${r.caught}/${r.total} traps caught, ${r.false} false alarm${r.false===1?"":"s"}`);
  }
});
document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")e.target.classList.remove("on")});
render();
</script>
</body>
</html>
